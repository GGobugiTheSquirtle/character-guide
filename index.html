<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>어나더에덴 캐릭터 가이드</title>
<style>
  :root {
    --bg: #0f0e14;
    --panel: #1a1822;
    --panel-2: #25222f;
    --line: #34303f;
    --text: #e8e6ef;
    --muted: #8b8595;
    --gold: #d4ae5b;
    --gold-dim: #8b7437;
    --accent: #b69b6e;
    --red: #c66062;
    --green: #6c9e6e;
    --blue: #6c8ec1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { background: var(--bg); color: var(--text); font-family: 'Noto Sans KR', -apple-system, sans-serif; line-height: 1.5; }
  body { min-height: 100vh; }

  header { position: sticky; top: 0; z-index: 100; background: rgba(15,14,20,0.95); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); padding: 14px 24px; }
  .header-row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; max-width: 1600px; margin: 0 auto; }
  .title { font-family: 'Noto Serif KR', serif; font-size: 20px; font-weight: 700; color: var(--gold); letter-spacing: 0.5px; flex-shrink: 0; }
  .title small { display: block; font-size: 11px; color: var(--muted); font-weight: 400; letter-spacing: 0; }
  .stats { color: var(--muted); font-size: 12px; margin-left: auto; }
  .stats b { color: var(--gold); font-weight: 600; }
  #search { flex: 1; min-width: 200px; max-width: 400px; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); padding: 8px 12px; border-radius: 6px; font-size: 14px; }
  #search:focus { outline: none; border-color: var(--gold-dim); }

  .filters { padding: 12px 24px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .filter-row { display: flex; gap: 24px; flex-wrap: wrap; max-width: 1600px; margin: 0 auto; }
  .filter-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .filter-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-right: 4px; }
  .chip { padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 12px; cursor: pointer; user-select: none; color: var(--muted); transition: all 0.12s; }
  .chip:hover { border-color: var(--gold-dim); color: var(--text); }
  .chip.active { background: var(--gold); border-color: var(--gold); color: #2a2317; font-weight: 600; }

  .container { max-width: 1600px; margin: 0 auto; padding: 16px 24px 60px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; cursor: pointer; transition: transform 0.12s, border-color 0.12s; display: flex; gap: 12px; align-items: flex-start; position: relative; }
  .card:hover { transform: translateY(-2px); border-color: var(--gold-dim); }
  .card.stub { opacity: 0.55; }
  .card.stub:hover { opacity: 0.8; }
  .card .icon { width: 56px; height: 56px; flex-shrink: 0; background: var(--panel-2); border-radius: 6px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .card .icon img { width: 100%; height: 100%; object-fit: cover; }
  .card .icon-fallback { color: var(--muted); font-size: 10px; }
  .card .body { flex: 1; min-width: 0; }
  .card .nameKo { font-size: 14px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .nameSub { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .card .badges { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  .badge { font-size: 10px; padding: 2px 6px; border-radius: 3px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }
  .badge.sa { background: rgba(212,174,91,0.15); color: var(--gold); border-color: var(--gold-dim); }
  .badge.style-AS { background: rgba(108,158,193,0.15); color: var(--blue); border-color: #3a4d6b; }
  .badge.style-ES { background: rgba(108,158,110,0.15); color: var(--green); border-color: #3a5c3c; }
  .badge.style-Alter, .badge.style-Alter-AS { background: rgba(198,96,98,0.15); color: var(--red); border-color: #6b3a3c; }
  .conf-indicator { position: absolute; top: 6px; right: 6px; font-size: 9px; color: var(--muted); }
  .conf-indicator.high { color: var(--green); }
  .conf-indicator.mid { color: var(--gold-dim); }

  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; overflow-y: auto; padding: 40px 16px; }
  .modal.open { display: block; }
  .modal-body { max-width: 900px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 32px; position: relative; }
  .modal-close { position: absolute; top: 12px; right: 14px; background: none; border: none; color: var(--muted); font-size: 28px; cursor: pointer; line-height: 1; }
  .modal-close:hover { color: var(--text); }
  .modal-header { display: flex; gap: 20px; align-items: center; margin-bottom: 24px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
  .modal-header .icon-lg { width: 80px; height: 80px; border-radius: 8px; overflow: hidden; background: var(--panel-2); flex-shrink: 0; }
  .modal-header .icon-lg img { width: 100%; height: 100%; object-fit: cover; }
  .modal-header h2 { font-family: 'Noto Serif KR', serif; font-size: 26px; color: var(--gold); margin: 0; }
  .modal-header .name-meta { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .modal-header .meta-badges { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .section { margin-bottom: 28px; }
  .section h3 { font-family: 'Noto Serif KR', serif; font-size: 16px; color: var(--gold); margin-bottom: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .section h4 { font-size: 13px; color: var(--accent); margin: 14px 0 8px; }
  .section .text-block, .section p { font-size: 13px; line-height: 1.7; color: var(--text); white-space: pre-wrap; word-break: keep-all; }
  .section .text-block { background: var(--panel-2); border-left: 3px solid var(--gold-dim); padding: 12px 16px; border-radius: 0 6px 6px 0; }

  .skill-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .skill-table th, .skill-table td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  .skill-table th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  .skill-table td { color: var(--text); }
  .skill-table tr:hover { background: var(--panel-2); }

  /* 2026-10-07 공식 한국어 스킬 — 효과 단위 칩 */
  .fx-input { background: var(--panel-2); border: 1px solid var(--line); color: var(--text); padding: 4px 10px; border-radius: 999px; font-size: 12px; width: 190px; }
  .fx-input:focus { outline: none; border-color: var(--gold-dim); }
  .chip.fx-sel::after { content: " ×"; }
  .skko-block { margin-bottom: 18px; }
  .skko-src { font-size: 11px; color: var(--muted); margin: -4px 0 10px; }
  .skko-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 14px; }
  .skko-tags .chip { font-size: 11px; padding: 2px 8px; }
  .skko-item { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .skko-name { font-weight: 600; font-size: 13px; color: var(--text); }
  .skko-name .mp { color: var(--blue); font-weight: 400; font-size: 11px; margin-left: 6px; }
  .skko-name .tag { color: var(--muted); font-weight: 400; font-size: 11px; margin-left: 6px; }
  .skko-name .mult { color: var(--red); font-weight: 600; font-size: 11px; margin-left: 8px; padding: 0 5px; border: 1px solid #6b3a3c; border-radius: 3px; }
  .fx-list { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .fx { font-size: 11px; padding: 2px 7px; border-radius: 4px; border: 1px solid var(--line); color: var(--text); background: var(--panel); line-height: 1.5; }
  .fx b { font-weight: 600; margin-right: 4px; }
  .fx .cond { color: var(--muted); }
  .fx .mode { color: var(--accent); }
  .fx.k-attack { border-color: #6b3a3c; } .fx.k-attack b { color: var(--red); }
  .fx.k-stat_pct b, .fx.k-stat_flat b, .fx.k-dmg b { color: var(--blue); }
  .fx.k-buff { border-color: var(--gold-dim); } .fx.k-buff b { color: var(--gold); }
  .fx.k-ailment b { color: #b48ad6; }
  .fx.k-guard b, .fx.k-heal b { color: var(--green); }
  .fx.k-zone b { color: var(--accent); }
  .fx.k-stack b, .fx.k-power b, .fx.k-action b, .fx.k-af b, .fx.k-dispel b, .fx.k-cost b { color: var(--muted); }
  .fx.k-other { color: var(--muted); border-style: dashed; }
  .skko-raw { margin-top: 6px; font-size: 11px; color: var(--muted); white-space: pre-wrap; }
  .skko-raw summary { cursor: pointer; }
  .badge.skko { background: rgba(108,142,193,0.12); color: var(--blue); border-color: #3a4d6b; }
  /* 파티 구성 (2026-10-07) */
  .party { max-width: 1400px; margin: 0 auto; }
  .party-h { font-family: 'Noto Serif KR', serif; color: var(--gold); font-size: 18px; margin-bottom: 4px; }
  .table-scroll { overflow-x: auto; }
  .party-table td { min-width: 150px; }
  .party-table td:first-child, .party-table th:first-child { min-width: 110px; position: sticky; left: 0; background: var(--panel); }
  .pt { font-size: 11px; line-height: 1.5; color: var(--text); }
  .pt.more { color: var(--muted); }
  .role-gap { color: var(--red) !important; font-weight: 600; }
  .slots { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .slot-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
  .slot-row .filter-label { width: 36px; align-self: center; }
  .slot { flex: 1 1 140px; max-width: 200px; background: var(--panel-2); border: 1px solid var(--gold-dim); border-radius: 8px; padding: 6px 8px; }
  .slot.empty { border-style: dashed; border-color: var(--line); color: var(--muted); }
  .slot-no { font-size: 10px; color: var(--muted); }
  .slot-name { font-size: 13px; font-weight: 600; margin: 2px 0 4px; }
  .slot-ctl { display: flex; gap: 4px; }
  .slot-btn { background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; font-size: 11px; padding: 1px 6px; cursor: pointer; }
  .slot-btn:hover { color: var(--text); border-color: var(--gold-dim); }
  .role-ok { color: var(--gold); }

  .sources { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); margin-top: 16px; }
  .sources a { color: var(--muted); font-size: 12px; text-decoration: none; padding: 4px 10px; border: 1px solid var(--line); border-radius: 4px; }
  .sources a:hover { color: var(--gold); border-color: var(--gold-dim); }

  /* 영입 조건 · 조건템 (2026-09-22) */
  .view-toggle { display: flex; gap: 6px; }
  .view-btn { padding: 5px 12px; border: 1px solid var(--line); background: var(--panel-2); color: var(--muted); border-radius: 6px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .view-btn:hover { border-color: var(--gold-dim); color: var(--text); }
  .view-btn.active { background: var(--gold); border-color: var(--gold); color: #2a2317; font-weight: 600; }

  .badge.free { background: rgba(108,158,110,0.18); color: var(--green); border-color: #3a5c3c; }

  .recruit-box { background: var(--panel-2); border-left: 3px solid var(--green); border-radius: 0 6px 6px 0; padding: 12px 16px; font-size: 13px; line-height: 1.8; }
  .recruit-box.gacha { border-left-color: var(--gold-dim); }
  .recruit-line { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .recruit-line .k { color: var(--muted); font-size: 11px; min-width: 56px; letter-spacing: 0.5px; }
  .recruit-line .v { color: var(--text); flex: 1; min-width: 0; }
  .recruit-raw { color: var(--muted); font-size: 11px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); word-break: break-all; }

  .book-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .book-table th, .book-table td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  .book-table th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  .book-table .rank { color: var(--gold); white-space: nowrap; }
  .book-table .qty { color: var(--accent); white-space: nowrap; text-align: right; }
  .book-table .jp { color: var(--muted); font-size: 11px; display: block; margin-top: 2px; }
  .book-table tr:hover { background: var(--panel-2); }

  .est-mark { font-size: 9px; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 1px 4px; margin-left: 6px; vertical-align: middle; }
  .est-mark.est { color: var(--red); border-color: #6b3a3c; }

  .dungeon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .dungeon-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .dungeon-card h3 { font-family: 'Noto Serif KR', serif; font-size: 15px; color: var(--gold); margin-bottom: 2px; }
  .dungeon-card .sub { font-size: 11px; color: var(--muted); margin-bottom: 10px; }
  .dungeon-card ul { list-style: none; }
  .dungeon-card li { font-size: 12.5px; padding: 5px 0; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: baseline; cursor: pointer; }
  .dungeon-card li:hover .who { color: var(--gold); }
  .dungeon-card li .who { color: var(--text); flex-shrink: 0; }
  .dungeon-card li .what { color: var(--muted); font-size: 11px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .note-bar { font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; line-height: 1.7; }
  .note-bar b { color: var(--accent); }

  .quest-cat { font-family: 'Noto Serif KR', serif; font-size: 15px; color: var(--gold); margin: 22px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .quest-cat span { color: var(--muted); font-size: 11px; font-family: 'Noto Sans KR', sans-serif; margin-left: 8px; }
  .quest-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
  .quest-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .quest-card h4 { font-size: 14px; color: var(--text); font-weight: 600; line-height: 1.45; }
  .quest-card .qsub { font-size: 11.5px; color: var(--accent); margin-top: 3px; }
  .quest-card .qjp { font-size: 10.5px; color: var(--muted); margin-top: 3px; }
  .cond-list { list-style: none; margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--line); }
  .cond-list li { font-size: 12.5px; color: var(--text); padding: 3px 0 3px 15px; position: relative; line-height: 1.6; }
  .cond-list li::before { content: "▸"; position: absolute; left: 0; color: var(--gold-dim); }
  .cond-list li.t-main::before { color: var(--blue); }
  .cond-list li.t-chara_quest::before, .cond-list li.t-party::before, .cond-list li.t-party_member::before { color: var(--green); }
  .cond-list li .stage { color: var(--muted); font-size: 10.5px; margin-left: 5px; }
  .quest-recruits { margin-top: 10px; padding-top: 9px; border-top: 1px dashed var(--line); font-size: 12px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: baseline; }
  .quest-recruits .who { color: var(--green); cursor: pointer; border-bottom: 1px dotted var(--green); }
  .quest-recruits .who:hover { color: var(--gold); border-color: var(--gold); }
  .unlock-box { margin-top: 10px; padding-top: 9px; border-top: 1px dashed var(--line); }
  .unlock-box .cap { font-size: 11px; color: var(--muted); letter-spacing: 0.5px; margin-bottom: 4px; }

  .empty-state { text-align: center; padding: 80px 20px; color: var(--muted); }
  .stub-notice { background: var(--panel-2); border: 1px dashed var(--line); border-radius: 8px; padding: 20px; color: var(--muted); text-align: center; font-size: 13px; margin: 20px 0; }
  .stub-notice b { color: var(--accent); }
  .stub-notice a { color: var(--gold); text-decoration: none; }
  .loading { padding: 40px; text-align: center; color: var(--muted); }
  /* 최적 세팅 · 장비 칸 (2026-10-08) */
  .gear-ed { display: flex; flex-direction: column; gap: 3px; min-width: 230px; }
  .gear-row { display: flex; gap: 6px; align-items: center; }
  .gear-k { color: var(--muted); font-size: 10px; width: 52px; flex-shrink: 0; }
  .fx-input.gear-in { border-radius: 6px; width: 100%; min-width: 0; padding: 3px 8px; font-size: 11.5px; }
  .cw { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 12px; }
  .cw-box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
  .cw-box h4 { font-family: 'Noto Serif KR', serif; color: var(--gold); font-size: 14px; margin-bottom: 8px; }
  .cw-num { width: 76px; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); border-radius: 4px; padding: 2px 6px; font-size: 12px; font-family: inherit; }
  .cw-num:focus { outline: none; border-color: var(--gold-dim); }
  .skill-table td.up { color: var(--green); } .skill-table td.down { color: var(--red); }
  .cw .skill-table th, .cw .skill-table td { padding: 5px 6px; } .cw .skill-table td:first-child { white-space: nowrap; }
  .inv-ta { width: 100%; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 8px 10px; font-size: 12px; font-family: inherit; resize: vertical; }
  .inv-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .inv-chips .chip, .filter-group .chip { font-size: 11px; padding: 2px 8px; }
  @media (max-width: 860px) { .cw { grid-template-columns: 1fr; } .container { padding: 12px 16px 60px; } }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div class="title">어나더에덴<small>Character Database</small></div>
    <input id="search" type="text" placeholder="캐릭명 검색 (한/영/일)…">
    <div class="view-toggle" id="view-toggle"></div>
    <div class="stats" id="stats">로딩 중…</div>
  </div>
</header>

<div class="filters" id="filters">
  <div class="filter-row" id="filter-row"></div>
</div>

<div class="container">
  <div id="grid" class="grid"><div class="loading">데이터 로딩 중…</div></div>
  <div id="quest-view" hidden></div>
  <div id="dungeon-view" hidden></div>
  <div id="party-view" hidden></div>
  <div id="opt-view" hidden></div>
</div>

<div class="modal" id="modal">
  <div class="modal-body" id="modal-body"></div>
</div>

<template id="card-tpl">
  <div class="card">
    <div class="icon"></div>
    <div class="body">
      <div class="nameKo"></div>
      <div class="nameSub"></div>
      <div class="badges"></div>
    </div>
    <div class="conf-indicator"></div>
  </div>
</template>

<script src="calc/ae_calc.js"></script>
<script src="calc/party_calc.js"></script>
<script src="calc/optimizer.js"></script>
<script>
const STATE = {
  all: [],
  filters: { element: "", weapon: "", style: "", sa: false, hasFull: false, recruit: "", skillsKo: false, effects: [], roles: [] },
  search: "",
  // 영입 조건 · 조건템 (2026-09-22)
  recruit: {},        // id → { recruit, books, … }
  dungeons: {},       // 던전 한글명 → { name_jp, src, drops[] }
  recruitMeta: {},
  quests: [],         // 퀘스트 해금 조건 (altema)
  questByJp: {},      // 일본어 원제 → 퀘스트 (영입 조건과 연결)
  view: "chars",      // chars | dungeons | quests
};

const ELEM_KO = {fire:"불",water:"물",earth:"땅",wind:"바람",thunder:"뇌",shade:"그림자",crystal:"결정","null":"무"};
const WEAP_KO = {sword:"검",katana:"도",axe:"도끼",lance:"창",bow:"활",fist:"권갑",staff:"지팡이",hammer:"망치"};

// 스킬표 일본어 헤더 → 한국어
const SKILL_HEADER_KO = {
  "ランク": "랭크", "スキル名": "스킬명", "属性": "속성", "MP": "MP",
  "威力(実質倍率)": "위력", "威力": "위력", "特記事項": "비고", "効果": "효과",
};

  { label: "속성", key: "element", values: [["", "전체"], ["fire","불"], ["water","물"], ["earth","땅"], ["wind","바람"], ["thunder","뇌"], ["shade","그림자"], ["crystal","결정"], ["null","무"]] },

];

// ─────────────────────────────────────
// 안전한 DOM 헬퍼 (textContent 기반)
// ─────────────────────────────────────
function el(tag, opts = {}) {
  const e = document.createElement(tag);
  if (opts.class) e.className = opts.class;
  if (opts.text != null) e.textContent = opts.text;
  if (opts.attrs) for (const k in opts.attrs) e.setAttribute(k, opts.attrs[k]);
  if (opts.dataset) for (const k in opts.dataset) e.dataset[k] = opts.dataset[k];
  if (opts.children) for (const c of opts.children) if (c) e.appendChild(c);
  if (opts.style) e.style.cssText = opts.style;
  return e;
}
function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
function badgeEl(text, extraClass = "") {
  return el("span", { class: "badge " + extraClass, text });
}

// ─────────────────────────────────────
// Init & data load
// ─────────────────────────────────────
async function init() {
  buildFilters();
  buildViewToggle();
  try {
    const [res, resR, resQ] = await Promise.all([
      fetch('data/index.json'),
      fetch('data/recruit.json').catch(() => null),
      fetch('data/quests.json').catch(() => null),
    ]);
    const data = await res.json();
    STATE.all = data.characters;
    if (resR && resR.ok) {
      const rec = await resR.json();
      STATE.recruit = rec.characters || {};
      STATE.dungeons = rec.dungeon_index || {};
      STATE.recruitMeta = rec.meta || {};
    }
    if (resQ && resQ.ok) {
      const qd = await resQ.json();
      STATE.quests = qd.quests || [];
      for (const q of STATE.quests) {
        if (q.title_jp) STATE.questByJp[q.title_jp] = q;
      }
    }
    const stats = document.getElementById('stats');
    clear(stats);
    stats.append("총 ", strong(data.meta.total), "명 · 매핑 ", strong(data.meta.with_mapping), " · 상세 ", strong(data.meta.with_full));
    render();
  } catch (e) {
    const grid = document.getElementById('grid');
    clear(grid);
    grid.appendChild(el("div", { class: "empty-state", text: "데이터 로드 실패: " + e.message }));
  }
}
function strong(t) { return el("b", { text: t }); }

function buildFilters() {
  const row = document.getElementById('filter-row');
  for (const def of FILTER_DEFS) {
    const group = el("div", { class: "filter-group" });
    group.appendChild(el("span", { class: "filter-label", text: def.label }));
    for (const [val, label] of def.values) {
      const chip = el("span", {
        class: "chip" + (val === "" ? " active" : ""),
        text: label,
        dataset: { filter: def.key, value: val }
      });
      chip.addEventListener('click', () => onChipClick(chip, def.key, val, false));
      group.appendChild(chip);
    }
    row.appendChild(group);
  }
  // 토글 필터
  const toggleGroup = el("div", { class: "filter-group" });
  toggleGroup.appendChild(el("span", { class: "filter-label", text: "기타" }));
  for (const [key, label] of [["sa", "SA 보유"], ["hasFull", "상세 정보 있음"], ["skillsKo", "공식 한국어 스킬"]]) {
    const chip = el("span", { class: "chip", text: label, dataset: { filter: key } });
    chip.addEventListener('click', () => {
      chip.classList.toggle('active');
      STATE.filters[key] = chip.classList.contains('active');
      render();
    });
    toggleGroup.appendChild(chip);
  }
  row.appendChild(toggleGroup);
  row.appendChild(buildEffectFilter());
  row.appendChild(buildRoleFilter());
}

// 2026-10-07 역할 필터 — index.json roles (효과 단위 → 전투 역할, _tools/character/skill_roles_ko.py). 여러 개 = 모두 가진 캐릭
const ROLE_KO = { atk_buff: "공격 버프", atk_state: "공격 강화 상태", atk_debuff: "공격 디버프", zone: "ZONE",
  power: "조건부 위력", surv_debuff: "생존 디버프", surv_buff: "생존 버프", surv_state: "생존 상태",
  recover: "회복·정화", tempo: "속도·행동", dot: "지속 대미지", enemy_utility: "적 버프 무력화",
  mode: "상태·형태 변화", resource: "자원", attack: "공격", state_unknown: "기타 상태" };
const ROLE_HINT = { atk_buff: "아군 힘·지능·크리티컬·속성 공격 UP, 가하는 대미지 UP",
  atk_state: "아군에게 거는 대미지 증가 상태 — 심기일체·정신 통일·오버 크리티컬·하극상·방어 무시 등",
  atk_debuff: "적이 받는 피해 증가 — 저항·내구·정신 DOWN, 약점 간파, 브레이크 축적",
  power: "스킬 자체 배율 조건 — 「독 상태인 경우 위력 증가」 등",
  surv_debuff: "적 공격 약화 — 힘·지능·속성 공격·속도 DOWN, 기절·수면·마비",
  surv_buff: "아군 방어 강화 — 저항·내구·정신·HP 최대치 UP, 받는 대미지 DOWN",
  surv_state: "배리어·실드·무효·버티기·도발·수호·감싸기",
  recover: "HP 회복·전투 불능 회복·디버프/상태 이상 해제", tempo: "아군 속도 UP·재공격·연속 실행·솔선" };
const PARTY_ROLES = ["atk_buff", "atk_state", "atk_debuff", "zone", "power", "surv_debuff", "surv_buff", "surv_state", "recover", "tempo", "dot", "enemy_utility"];
function buildRoleFilter() {
  const group = el("div", { class: "filter-group" });
  group.appendChild(el("span", { class: "filter-label", text: "역할" }));
  for (const r of PARTY_ROLES) {
    const chip = el("span", { class: "chip", text: ROLE_KO[r], attrs: { title: ROLE_HINT[r] || "" } });
    chip.addEventListener('click', () => {
      chip.classList.toggle('active');
      const f = STATE.filters;
      f.roles = chip.classList.contains('active') ? [...f.roles, r] : f.roles.filter(x => x !== r);
      render();
    });
    group.appendChild(chip);
  }
  return group;
}

// 2026-10-07 효과 단위 필터 — index.json 의 effect_tags (공식 공지 한국어 스킬에서 추출). 고른 태그를 모두 가진 캐릭
function buildEffectFilter() {
  const group = el("div", { class: "filter-group" });
  group.appendChild(el("span", { class: "filter-label", text: "효과" }));
  // 필터 줄은 데이터 로드 전에 만들어진다 — 태그 목록은 쓸 때 센다
  const counts = () => {
    const n = {};
    for (const c of STATE.all) for (const t of (c.effect_tags || [])) n[t] = (n[t] || 0) + 1;
    return n;
  };
  const dl = el("datalist", { attrs: { id: "fx-tags" } });
  const input = el("input", { class: "fx-input", attrs: { list: "fx-tags", placeholder: "효과 검색 (예: 심기일체)" } });
  input.addEventListener('focus', () => {
    if (dl.childElementCount) return;
    const n = counts();
    for (const t of Object.keys(n).sort((a, b) => n[b] - n[a] || a.localeCompare(b)))
      dl.appendChild(el("option", { attrs: { value: t, label: `${n[t]}명` } }));
  });
  const sel = el("span", { class: "filter-group", attrs: { id: "fx-selected" } });
  input.addEventListener('change', () => {
    const v = input.value.trim();
    if (counts()[v]) addEffectFilter(v);
    input.value = "";
  });
  group.append(dl, input, sel);
  return group;
}
function addEffectFilter(tag) {
  const f = STATE.filters;
  if (!f.effects.includes(tag)) f.effects.push(tag);
  renderEffectChips();
  setView("chars");
}
function renderEffectChips() {
  const sel = document.getElementById('fx-selected');
  if (!sel) return;
  clear(sel);
  for (const t of STATE.filters.effects) {
    const chip = el("span", { class: "chip active fx-sel", text: t });
    chip.addEventListener('click', () => {
      STATE.filters.effects = STATE.filters.effects.filter(x => x !== t);
      renderEffectChips(); render();
    });
    sel.appendChild(chip);
  }
}

function onChipClick(chip, key, val, toggle) {
  document.querySelectorAll(`.chip[data-filter="${key}"]`).forEach(x => x.classList.remove('active'));
  chip.classList.add('active');
  STATE.filters[key] = val;
  render();
}

// ─────────────────────────────────────
// Filter & render
// ─────────────────────────────────────
function applyFilters() {
  let list = STATE.all;
  const f = STATE.filters;
  if (f.element) list = list.filter(c => c.element === f.element);
  if (f.weapon)  list = list.filter(c => c.weapon === f.weapon);
  if (f.style)   list = list.filter(c => c.style === f.style || (f.style === "Alter" && c.style?.startsWith("Alter")));
  if (f.sa)      list = list.filter(c => c.sa);
  if (f.hasFull) list = list.filter(c => c.has_full);
  if (f.skillsKo) list = list.filter(c => c.skills_ko);
  if (f.roles.length) list = list.filter(c => f.roles.every(r => (c.roles || {})[r]));
  if (f.effects.length) list = list.filter(c => f.effects.every(t => (c.effect_tags || []).includes(t)));
  if (f.recruit === "books") {
    list = list.filter(c => (STATE.recruit[c.id]?.books || []).length > 0);
  } else if (f.recruit) {
    list = list.filter(c => STATE.recruit[c.id]?.recruit?.kind === f.recruit);
  }
  if (STATE.search) {
    const q = STATE.search.toLowerCase();
    list = list.filter(c =>
      (c.nameKo || "").toLowerCase().includes(q) ||
      (c.nameEn || "").toLowerCase().includes(q) ||
      (c.name_jp || "").toLowerCase().includes(q)
    );
  }
  return list;
}

// ─────────────────────────────────────
// 영입 조건 · 조건템 (2026-09-22)
// ─────────────────────────────────────
function setView(key) {
  STATE.view = key;
  document.querySelectorAll('#view-toggle .view-btn').forEach(x => x.classList.toggle('active', x.dataset.view === key));
  render();
}
function buildViewToggle() {
  const wrap = document.getElementById('view-toggle');
  if (!wrap) return;
  for (const [key, label] of [["chars", "캐릭터"], ["quests", "퀘스트 해금"], ["dungeons", "조건템 던전"], ["party", "파티 구성"], ["opt", "최적 세팅"]]) {
    const b = el("button", { class: "view-btn" + (STATE.view === key ? " active" : ""), text: label, dataset: { view: key } });
    b.addEventListener('click', () => {
      STATE.view = key;
      wrap.querySelectorAll('.view-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      render();
    });
    wrap.appendChild(b);
  }
}

// 표기 신뢰도 마크 — est(추정)만 눈에 띄게
function srcMark(src) {
  if (!src || src === "ding" || src === "local") return null;
  return el("span", { class: "est-mark est", text: "추정", attrs: { title: "한섭 실표기 미확인 — 일본어 원문 병기 참고" } });
}

function kvLine(k, v, mark) {
  const val = el("span", { class: "v", text: v });
  if (mark) val.appendChild(mark);
  return el("div", { class: "recruit-line", children: [el("span", { class: "k", text: k }), val] });
}

function buildRecruitSection(id) {
  const data = STATE.recruit[id];
  const r = data?.recruit;
  if (!r) return null;

  const box = el("div", { class: "recruit-box" + (r.kind === "gacha" ? " gacha" : "") });
  box.appendChild(kvLine("경로", r.kind_ko || r.kind));

  if (r.kind === "free") {
    if (r.category) box.appendChild(kvLine("분류", r.category));
    const quest = r.quest || r.quest_jp;
    if (quest) box.appendChild(kvLine("퀘스트", quest, r.quest ? srcMark(r.quest_src) : null));
    if (r.step) box.appendChild(kvLine("시점", r.step));
    if (r.note) box.appendChild(kvLine("비고", r.note));
  }
  if (r.related_styles?.length) box.appendChild(kvLine("다른 스타일", r.related_styles.join(", ")));

  // 그 퀘스트 자체의 해금 조건 (altema) — 영입까지의 전체 경로를 한 곳에서
  const q = r.quest_jp ? STATE.questByJp[r.quest_jp] : null;
  if (q?.conditions?.length) {
    const unlock = el("div", { class: "unlock-box" });
    unlock.appendChild(el("div", { class: "cap", text: "이 퀘스트가 열리는 조건" }));
    unlock.appendChild(condListEl(q.conditions));
    box.appendChild(unlock);
  }

  if (r.raw) box.appendChild(el("div", { class: "recruit-raw", text: "원문: " + r.raw }));

  return el("div", { class: "section", children: [el("h3", { text: "영입 조건" }), box] });
}

function buildBooksSection(id) {
  const data = STATE.recruit[id];
  if (!data) return null;
  if (!data.books?.length) {
    if (!data.books_none) return null;
    return el("div", {
      class: "section",
      children: [el("h3", { text: "☆5 각성 재료 (조건템)" }),
                 el("div", { class: "recruit-box", text: "필요 서물 없음" })]
    });
  }

  const tbl = el("table", { class: "book-table" });
  const thead = el("thead");
  const trh = el("tr");
  for (const h of ["등급", "필요 서물", "수량", "획득처"]) trh.appendChild(el("th", { text: h }));
  thead.appendChild(trh);
  tbl.appendChild(thead);

  const tb = el("tbody");
  for (const b of data.books) {
    const tr = el("tr");
    tr.appendChild(el("td", { class: "rank", text: b.rank || "—" }));

    const nameTd = el("td");
    nameTd.appendChild(el("span", { text: b.name || b.name_jp }));
    if (b.name && b.name !== b.name_jp) nameTd.appendChild(el("span", { class: "jp", text: b.name_jp }));
    tr.appendChild(nameTd);

    tr.appendChild(el("td", { class: "qty", text: "×" + (b.qty || 1) }));

    const srcTd = el("td");
    if (b.source) {
      srcTd.appendChild(el("span", { text: b.source }));
      const mk = srcMark(b.source_src);
      if (mk) srcTd.appendChild(mk);
      if (b.source_jp) srcTd.appendChild(el("span", { class: "jp", text: b.source_jp }));
    } else {
      srcTd.appendChild(el("span", { class: "jp", text: "획득처 정보 없음" }));
    }
    tr.appendChild(srcTd);
    tb.appendChild(tr);
  }
  tbl.appendChild(tb);

  return el("div", { class: "section", children: [el("h3", { text: "☆5 각성 재료 (조건템)" }), tbl] });
}

function condListEl(conditions) {
  const ul = el("ul", { class: "cond-list" });
  for (const c of conditions || []) {
    const li = el("li", { class: "t-" + (c.type === "main_story" ? "main" : c.type) });
    li.appendChild(el("span", { text: c.text }));
    if (c.stage) li.appendChild(el("span", { class: "stage", text: "(" + c.stage + ")" }));
    ul.appendChild(li);
  }
  return ul;
}

function renderQuests() {
  const host = document.getElementById('quest-view');
  clear(host);
  if (!STATE.quests.length) {
    host.appendChild(el("div", { class: "empty-state", text: "퀘스트 데이터가 없습니다. data/quests.json 을 확인하세요." }));
    return;
  }

  host.appendChild(el("div", {
    class: "note-bar",
    children: [
      el("b", { text: "해금 조건 = 퀘스트가 열리는 선행 조건. " }),
      el("span", { text: "출처 altema.jp(일본). 한글 퀘스트명은 국내 체크리스트 정본 기준이며, 일본 서버 기준 조건이라 한섭 진행도와 어긋날 수 있습니다." }),
    ]
  }));

  const byCat = {};
  for (const q of STATE.quests) (byCat[q.category] || (byCat[q.category] = [])).push(q);

  for (const [cat, list] of Object.entries(byCat)) {
    const h = el("div", { class: "quest-cat", text: cat });
    h.appendChild(el("span", { text: list.length + "개" }));
    host.appendChild(h);

    const grid = el("div", { class: "quest-grid" });
    for (const q of list) {
      const card = el("div", { class: "quest-card" });
      const title = el("h4", { text: q.title });
      const mk = srcMark(q.title_src);
      if (mk) title.appendChild(mk);
      card.appendChild(title);
      if (q.sub) card.appendChild(el("div", { class: "qsub", text: q.sub }));
      if (q.title_jp && q.title_jp !== q.title) card.appendChild(el("div", { class: "qjp", text: q.title_jp }));
      card.appendChild(condListEl(q.conditions));

      if (q.recruits?.length) {
        const box = el("div", { class: "quest-recruits" });
        box.appendChild(el("span", { text: "영입:" }));
        for (const r of q.recruits) {
          const a = el("span", { class: "who", text: r.name + (r.step ? ` (${r.step})` : "") });
          a.addEventListener('click', () => openModal(r.id));
          box.appendChild(a);
        }
        card.appendChild(box);
      }
      grid.appendChild(card);
    }
    host.appendChild(grid);
  }
}

function renderDungeons() {
  const host = document.getElementById('dungeon-view');
  clear(host);

  const entries = Object.entries(STATE.dungeons || {});
  if (!entries.length) {
    host.appendChild(el("div", { class: "empty-state", text: "조건템 데이터가 없습니다. data/recruit.json 을 확인하세요." }));
    return;
  }

  host.appendChild(el("div", {
    class: "note-bar",
    children: [
      el("b", { text: "조건템 = ☆5 각성(CC/SC)에 필요한 서물. " }),
      el("span", { text: "던전을 눌러 해당 던전에서 서물이 나오는 캐릭터를 확인합니다. 특정 던전이 명시되지 않은 '각종 VH 어나더 던전' 류는 여기 집계되지 않습니다." }),

  }));

    card.appendChild(h);
    card.appendChild(el("div", { class: "sub", text: `${d.name_jp} · ${d.drops.length}명분` }));

    const ul = el("ul");
    for (const drop of d.drops) {
      const li = el("li", {
        children: [

        ]
      });
      li.addEventListener('click', () => openModal(drop.id));
      ul.appendChild(li);
    }
    card.appendChild(ul);
    grid.appendChild(card);

  host.appendChild(grid);

function render() {
  const grid = document.getElementById('grid');
  const dview = document.getElementById('dungeon-view');
  const qview = document.getElementById('quest-view');
  const filters = document.getElementById('filters');
  grid.hidden = STATE.view !== "chars";
  qview.hidden = STATE.view !== "quests";
  dview.hidden = STATE.view !== "dungeons";
  document.getElementById('party-view').hidden = STATE.view !== "party";
  document.getElementById('opt-view').hidden = STATE.view !== "opt";
  filters.hidden = STATE.view !== "chars";
  if (STATE.view === "party") { renderParty(); return; }
  if (STATE.view === "opt") { renderOpt(); return; }
  if (STATE.view === "quests") { renderQuests(); return; }
  if (STATE.view === "dungeons") { renderDungeons(); return; }

  const list = applyFilters();
  clear(grid);
  if (!list.length) {
    grid.appendChild(el("div", { class: "empty-state", text: "필터 조건에 맞는 캐릭이 없습니다." }));
    return;
  }
  const frag = document.createDocumentFragment();
  for (const c of list) frag.appendChild(buildCard(c));
  grid.appendChild(frag);
}

function buildCard(c) {
  const tpl = document.getElementById('card-tpl');
  const node = tpl.content.firstElementChild.cloneNode(true);
  node.dataset.id = c.id;
  if (!c.has_full) node.classList.add('stub');
  if (c.style && c.style !== 'NS') node.classList.add('style-' + c.style.replace(/\s/g, '-'));

  // icon
  const iconBox = node.querySelector('.icon');
  if (c.icon) {
    const img = el("img", { attrs: { src: "images/icons/" + c.icon, alt: "", loading: "lazy" } });
    iconBox.appendChild(img);
  } else {
    iconBox.appendChild(el("span", { class: "icon-fallback", text: c.id.slice(0, 3) }));
  }

  // names
  node.querySelector('.nameKo').textContent = c.nameKo || "";
  const sub = node.querySelector('.nameSub');
  sub.textContent = (c.nameEn || "") + " · " + (c.name_jp || "—");

  // badges
  const badges = node.querySelector('.badges');
  if (ELEM_KO[c.element]) badges.appendChild(badgeEl(ELEM_KO[c.element]));
  if (WEAP_KO[c.weapon]) badges.appendChild(badgeEl(WEAP_KO[c.weapon]));
  if (c.style && c.style !== 'NS') badges.appendChild(badgeEl(c.style, "style-" + c.style.replace(/\s/g, '-')));
  if (c.sa) badges.appendChild(badgeEl("SA", "sa"));
  if (STATE.recruit[c.id]?.recruit?.kind === "free") badges.appendChild(badgeEl("무료", "free"));
  if (c.skills_ko) badges.appendChild(badgeEl("공식 스킬", "skko"));

  // confidence
  const conf = c.confidence || 0;
  const ind = node.querySelector('.conf-indicator');
  if (conf >= 0.9) { ind.classList.add('high'); ind.textContent = '✓'; }
  else if (conf >= 0.7) { ind.classList.add('mid'); ind.textContent = '~'; }
  else if (conf > 0) ind.textContent = '?';
  ind.title = `매핑 신뢰도 ${conf}`;

  node.addEventListener('click', () => openModal(c.id));
  return node;
}

async function openModal(id) {
  const modal = document.getElementById('modal');
  const body = document.getElementById('modal-body');
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
  clear(body);
  body.appendChild(closeBtn());

  const c = STATE.all.find(x => x.id === id);
  if (!c) { body.appendChild(el("div", { class: "empty-state", text: "캐릭을 찾을 수 없습니다." })); return; }

  body.appendChild(buildModalHeader(c));

  // 영입 조건 · 조건템 — 상세본 유무와 무관하게 먼저 (2026-09-22)
  const recSec = buildRecruitSection(id);
  if (recSec) body.appendChild(recSec);
  const bookSec = buildBooksSection(id);
  if (bookSec) body.appendChild(bookSec);
  if (c.skills_ko) body.appendChild(buildSkillsSection(c, "ko"));   // 상세본 없는 신규 캐릭도 공식 스킬은 보인다
  if (c.skills_en) body.appendChild(buildSkillsSection(c, "en"));   // 위키 영어 — 공식 한국어가 있으면 접어 둔 대조용

  if (!c.has_full) {
    body.appendChild(buildStubNotice(c));
    return;
  }

  const loader = el("div", { class: "loading", text: "로딩 중…" });
  body.appendChild(loader);
  try {
    const res = await fetch(`data/full/${c.id}.json`);
    const full = await res.json();
    loader.remove();
    appendModalContent(body, full);
  } catch (e) {
    loader.remove();
    body.appendChild(el("div", { class: "empty-state", text: "상세 데이터 로드 실패: " + e.message }));
  }
}

function closeBtn() {
  const b = el("button", { class: "modal-close", text: "×" });
  b.addEventListener('click', closeModal);
  return b;
}

function buildModalHeader(c) {
  const iconBox = el("div", { class: "icon-lg" });
  if (c.icon) iconBox.appendChild(el("img", { attrs: { src: "images/icons/" + c.icon, alt: "" } }));

  const badges = el("div", { class: "meta-badges" });
  if (ELEM_KO[c.element]) badges.appendChild(badgeEl(ELEM_KO[c.element]));
  if (WEAP_KO[c.weapon]) badges.appendChild(badgeEl(WEAP_KO[c.weapon]));
  if (c.style && c.style !== 'NS') badges.appendChild(badgeEl(c.style, "style-" + c.style.replace(/\s/g, '-')));
  if (c.sa) badges.appendChild(badgeEl("SA", "sa"));
  badges.appendChild(badgeEl("★" + c.rarity));
  if (c.date) badges.appendChild(badgeEl(c.date));

  const info = el("div", {
    children: [
      el("h2", { text: c.nameKo || "" }),

}

function buildStubNotice(c) {
  const notice = el("div", { class: "stub-notice" });

function appendModalContent(body, full) {
  const gi = full.game_info || {};

  const nws = nw.sections || {};

  // GI 운용법

  // NAMU 평가
  const proNS = findPrefix(nws, '5.1.1');
  const proAS = findPrefix(nws, '5.1.2');
  const conNS = findPrefix(nws, '5.2.1');
  const conAS = findPrefix(nws, '5.2.2');
  if (proNS || proAS || conNS || conAS) {

    if (proNS) { sec.appendChild(el("h4", { text: "장점 (노멀)" })); sec.appendChild(el("p", { text: proNS })); }
    if (proAS) { sec.appendChild(el("h4", { text: "장점 (어나더)" })); sec.appendChild(el("p", { text: proAS })); }
    if (conNS) { sec.appendChild(el("h4", { text: "단점 (노멀)" })); sec.appendChild(el("p", { text: conNS })); }
    if (conAS) { sec.appendChild(el("h4", { text: "단점 (어나더)" })); sec.appendChild(el("p", { text: conAS })); }
    body.appendChild(sec); appendedAny = true;
  }

  // GI 스킬 표
  if (gi.skills_raw && gi.skills_raw.length > 1) {
    body.appendChild(buildSkillTable(gi.skills_raw));
    appendedAny = true;
  }

  // GI 추천 장비
  if (gis['おすすめ装備']) { body.appendChild(buildTextSection("추천 장비/그라스타", gis['おすすめ装備'])); appendedAny = true; }
  if (gis['相性の良いキャラ']) { body.appendChild(buildTextSection("상성 좋은 캐릭", gis['相性の良いキャラ'])); appendedAny = true; }

  // NAMU 작중행적
  const arc1 = findPrefix(nws, '3.1');
  const arc15 = findPrefix(nws, '3.2');
  const arc2 = findPrefix(nws, '3.3');
  if (arc1 || arc15 || arc2) {
    const sec = el("div", { class: "section", children: [el("h3", { text: "작중행적 (스포 주의)" })] });
    if (arc1) { sec.appendChild(el("h4", { text: "제1부" })); sec.appendChild(el("p", { text: arc1 })); }
    if (arc15) { sec.appendChild(el("h4", { text: "제1.5부" })); sec.appendChild(el("p", { text: arc15 })); }
    if (arc2) { sec.appendChild(el("h4", { text: "제2부" })); sec.appendChild(el("p", { text: arc2 })); }
    body.appendChild(sec); appendedAny = true;
  }

  // 소스 링크
  const sources = el("div", { class: "sources" });
  if (gi.url) sources.appendChild(el("a", { text: "game-info.wiki ↗", attrs: { href: gi.url, target: "_blank" } }));
  if (nw.url) sources.appendChild(el("a", { text: "namu.wiki ↗", attrs: { href: nw.url, target: "_blank" } }));
  body.appendChild(sources);

  if (!appendedAny) {
    body.appendChild(el("div", { class: "stub-notice", text: "추출된 본문이 거의 없습니다. 원본 페이지를 직접 확인해 주세요." }));
  }
}

// 공식 한국어 스킬 (2026-10-07) — data/skills_ko/{id}.json
//   원천: 인게임 공지(news-ap notice_v2) · 빌더: _tools/character/build_skills_ko.py
// ─────────────────────────────────────
const SKKO_SECTION = { skills: "스킬", abilities: "어빌리티", stacks: "중첩", chain: "체인 어빌리티",
  stellar_skills: "성도 스킬", stellar_abilities: "추가 어빌리티", tenmei_ability: "천명 어빌리티",
  sb_enhance: "스텔라 버스트 강화", adjust_ns: "노멀 스타일 조정", adjust_as: "어나더 스타일 조정" };
const FX_KIND = { attack: "공격", stat_pct: "스탯", stat_flat: "스탯 수치", dmg: "대미지", zone: "ZONE", buff: "강화",
  ailment: "상태 이상", guard: "보호", heal: "회복", dispel: "해제", stack: "축적", power: "위력", action: "실행",
  cost: "대가", af: "AF·천명", other: "원문" };

function fxDur(u) {
  const p = [];
  if (u.turns) p.push(u.turns + "턴");
  if (u.actions) p.push(u.actions + "회 행동");
  if (u.times) p.push(u.times + "회");
  if (u.perm) p.push("영구");
  if (u.until_turn_end) p.push("턴 종료까지");
  if (u.max_stack) p.push("최대 " + u.max_stack + "중첩");
  if (u.chance) p.push(u.chance + "% 확률");
  return p.length ? " · " + p.join(", ") : "";
}
function fxText(u) {
  const sign = u.dir === "DOWN" ? "−" : "+";
  switch (u.k) {
    case "attack":
      if (u.fixed) return `${u.scope} 고정 ${u.fixed.toLocaleString()}${u.hits > 1 ? " ×" + u.hits : ""}`;
      return `${u.scope.replace(/^이후 /, "")} ${u.element || "무"} ${u.atk}${u.hits > 1 ? " ×" + u.hits : ""} (${u.power}${u.mult ? ", " + u.mult + "배" : ""})${u.preempt ? " 선제" : ""}`;
    case "stat_pct": return `${u.stats.join("·")} ${u.value != null ? sign + u.value + "%" : u.dir}${u.max ? " (최대)" : ""}${u.basis ? " ← " + u.basis : ""}`;
    case "stat_flat": return `${u.stats.join("·")} ${u.value != null ? sign + u.value : u.dir}${u.derived ? " (" + u.derived + ")" : ""}${u.basis ? " ← " + u.basis : ""}`;
    case "dmg": return `${u.what} ${u.value != null ? sign + u.value + "%" : u.dir}`;
    case "buff": case "ailment": return u.name;
    case "guard": return u.what + (u.value ? " " + u.value + "%" : "") + (u.detail ? " (" + u.detail + ")" : "");
    case "stack": return `${u.name || ""} ${u.value ?? ""} ${u.op}`.replace(/\s+/g, " ").trim();
    case "cost": return `${u.what} ${u.value}% 소모`;
    case "power": return u.what + (u.detail ? " (" + u.detail + ")" : "") + (u.xmult ? ` ×${u.xmult}` : "");
    case "heal": return /^(HP|MP)$/.test(u.what) ? `${u.what} 회복 ${u.value}${u.flat ? "" : "%"}`
      : u.what + (u.value != null ? ` ${u.value}${u.flat ? "" : "%"}` : u.power ? ` (${u.power})` : "");
    default: return u.what || u.raw;
  }
}
function fxChip(u) {
  const chip = el("span", { class: "fx k-" + u.k, attrs: { title: `[${ROLE_KO[u.r] || "-"} · ${u.tm || ""}${u.tc ? " · " + u.tc : ""}] ` + (u.raw || "") } });
  chip.appendChild(el("b", { text: FX_KIND[u.k] || u.k }));
  if (u.mode && u.mode !== "추가 효과") chip.appendChild(el("span", { class: "mode", text: `[${u.mode.replace(/ 효과$/, "")}] ` }));
  if (u.cond) chip.appendChild(el("span", { class: "cond", text: u.cond + " → " }));
  if (u.via) chip.appendChild(el("span", { class: "mode", text: `[${u.via}] ` }));
  chip.appendChild(document.createTextNode(u.k === "other" ? u.raw : fxText(u) + fxDur(u)));
  if (u.target && ["stat_pct", "stat_flat", "dmg", "buff", "ailment", "guard", "heal", "dispel"].includes(u.k))
    chip.appendChild(el("span", { class: "cond", text: " @" + u.target }));
  return chip;
}
// lang "ko" = 공식 공지(data/skills_ko) · "en" = 위키 영어(data/skills_en, _tools/character/build_skills_en.py).
// 영어도 효과는 같은 한국어 체계로 분해돼 있다 — 칩은 같고 원문만 영어
const SKILL_SRC = {

  en: { dir: "skills_en", title: "위키 스킬 (영문 원문 · 효과는 자동 분해)" },

function buildSkillsSection(c, lang) {
  const src = SKILL_SRC[lang];
  const folded = lang === "en" && c.skills_ko;                    // 공식 한국어가 정본 — 영어는 대조용으로 접는다

  if (!folded) {

    for (const t of (c.effect_tags || [])) {
      const chip = el("span", { class: "chip", text: t, attrs: { title: "이 효과를 가진 캐릭 보기" } });
      chip.addEventListener('click', () => { closeModal(); addEffectFilter(t); });
      tags.appendChild(chip);
    }
    sec.appendChild(tags);
    if (c.roles) sec.appendChild(el("div", { class: "skko-src", text: "역할: " + PARTY_ROLES.filter(r => c.roles[r]).map(r => `${ROLE_KO[r]} ${c.roles[r]}`).join(" · ") }));
    if (lang === "en") sec.appendChild(el("div", { class: "skko-src", text: "영어 문장 자동 분해 — 공식 한국어 61명과 대조한 역할 일치: 정밀도 0.84 · 재현율 0.77. 칩에 마우스를 올리면 원문." }));
  }
  const host = el("div", { class: "loading", text: "로딩 중…" });
  sec.appendChild(host);
  fetch(`data/${src.dir}/${c.id}.json`).then(r => r.json()).then(d => {
    host.className = ""; host.textContent = "";
    for (const b of d.blocks) {
      const blk = el("div", { class: "skko-block" });
      if (b.kind === "wiki") blk.appendChild(el("div", { class: "skko-src", text: `anothereden.wiki 「${b.who}」 · 스킬 문서 Cargo HeroSkills` }));
      else {
        blk.appendChild(el("h4", { text: b.kind === "sa" ? `성도 각성 「${b.class}」` : "신규 소개" }));
        blk.appendChild(el("div", { class: "skko-src", text: `공지 #${b.notice}` + (b.class_en ? ` · ${b.class_en}` : "") }));
      }
      for (const [key, items] of Object.entries(b.sections)) {
        if (!items.length) continue;
        blk.appendChild(el("div", { class: "filter-label", text: SKKO_SECTION[key] || key, style: "margin:10px 0 6px" }));
        for (const it of items) {
          const box = el("div", { class: "skko-item" });
          if (it.name) {
            const nm = el("div", { class: "skko-name", text: it.name });
            if (it.mp != null) nm.appendChild(el("span", { class: "mp", text: "MP " + it.mp }));
            if (it.tag) nm.appendChild(el("span", { class: "tag", text: it.tag }));
            if (it.wiki && it.wiki.mult) nm.appendChild(el("span", { class: "mult", text: "배율 " + it.wiki.mult + (it.wiki.crit ? " · 크리 " + it.wiki.crit : ""),
              attrs: { title: "anothereden.wiki Cargo HeroSkills 기준 — 현현 · 성능 조정 시점에 따라 공지와 다를 수 있음" } }));
            if (it.en) nm.appendChild(el("span", { class: "tag", text: it.en }));
            box.appendChild(nm);

          const list = el("div", { class: "fx-list" });
          for (const u of it.effects) if (u.k !== "meta" && !u.explain) list.appendChild(fxChip(u));
          box.appendChild(list);
          const raw = el("details", { class: "skko-raw" });
          raw.appendChild(el("summary", { text: "원문" }));
          raw.appendChild(document.createTextNode([...it.lines, ...(it.notes || [])].join("\n")));
          box.appendChild(raw);
          blk.appendChild(box);
        }
      }
      host.appendChild(blk);
    }
  }).catch(e => { host.className = "empty-state"; host.textContent = "스킬 로드 실패: " + e.message; });
  return sec;
}

// ─────────────────────────────────────
// 파티 구성 (2026-10-07) — 효과 단위 × 역할로 파티의 담당 · 빈칸 · 속성 정렬 · ZONE 충돌 · 배치를 본다
//   공식 한국어 스킬(있으면) 또는 위키 영어 스킬. 성도 각성은 완료로 보고 포함. 명단 = 칸 순서(0~3 전방 · 4~5 후방, 빈 칸 null), localStorage
// ─────────────────────────────────────
const PARTY_MAX = 6, FRONT_N = 4;                 // 전방 4 · 후방 2 — 칸 순서 = 화면 왼쪽부터
const ELEMS = ["불", "물", "땅", "바람", "번개", "그림자", "결정"];
STATE.party = (() => { try { return JSON.parse(localStorage.getItem('cg-party') || '[]').slice(0, PARTY_MAX); } catch { return []; } })();
STATE.skfx = {};
function saveParty() { try { localStorage.setItem('cg-party', JSON.stringify(STATE.party)); } catch {} }
const hasSkills = c => c && (c.skills_ko || c.skills_en);
async function loadSkills(c) {                        // 공식 한국어가 있으면 그것, 없으면 위키 영어
  const dir = c.skills_ko ? "skills_ko" : "skills_en";
  const key = dir + "/" + c.id;
  if (!STATE.skfx[key]) STATE.skfx[key] = await fetch(`data/${dir}/${c.id}.json`).then(r => r.json());
  return STATE.skfx[key];
}
function flatEffects(d) {
  const out = [];
  for (const b of d.blocks) for (const [sec, items] of Object.entries(b.sections))
    for (const it of items) {
      const atkItem = it.effects.some(u => u.k === "attack");      // 공격 스킬 속 성질은 그 스킬에만(party_calc)
      for (const u of it.effects) if (!u.explain) out.push({ ...u, _skill: it.name || "", _skillEn: it.en, _sec: sec, _atkItem: atkItem });
    }
  return out;
}
function uniqTexts(us, n = 4) {
  const seen = new Set(), out = [];
  for (const u of us) {
    const t = (u.cond ? "(" + u.cond.slice(0, 30) + ") " : "") + fxText(u) + fxDur(u) + (u.tc ? " @" + u.tc : "");
    if (!seen.has(t)) { seen.add(t); out.push(t); }
  }
  return [out.slice(0, n), out.length];

// 배치 조건 — 효과가 보유자의 위치를 요구하는가 (인원수 조건 「전방에 「검」 특성의 아군이 2명 이상」은 needOf 가 따로 센다)
const KO_COUNT = /((?:「[^」]+」\s*)+)특성(?:의)?\s*(?:아군|인원수)?[^。]*?(\d+)명\s*이상/;
const posReq = AEParty.posReq;                        // 자리 조건 판정은 calc/party_calc.js 한 곳(최적화 탐색과 공용)
function sideReq(u) {                                 // 「자신의 전방 좌측 아군」「ally to the right of user」
  const t = (u.scope || u.target || "") + " " + (u.raw || "");
  if (/양옆|left and right/i.test(t)) return ["L", "R"];
  if (/좌측|to the left of user|user's left|left of user/i.test(t)) return ["L"];
  if (/우측|to the right of user|user's right|right of user/i.test(t)) return ["R"];
  return null;
}
function needOf(u) {                                  // 인원수 특성 조건 — 영어는 빌더가 구조화(need), 한국어는 문장에서
  if (u.need) return u.need;
  const src = (u.cond || "") + " " + (u.raw || "");
  const mm = src.match(KO_COUNT);
  if (!mm) return null;
  return { traits: [...mm[1].matchAll(/「([^」]+)」/g)].map(x => x[1]), n: +mm[2], front: /전방/.test(src), others: /자신(을)? ?(제외|이외)/.test(src) };
}
function trimParty() { while (STATE.party.length && !STATE.party[STATE.party.length - 1]) STATE.party.pop(); }

function buildSlots() {

    while (p.length <= Math.max(i, j)) p.push(null);
    [p[i], p[j]] = [p[j], p[i]];
    trimParty(); saveParty(); renderParty();
  };
  for (const [label, from, to] of [["전방", 0, FRONT_N], ["후방", FRONT_N, PARTY_MAX]]) {
    const row = el("div", { class: "slot-row", children: [el("span", { class: "filter-label", text: label })] });
    for (let i = from; i < to; i++) {
      const id = STATE.party[i], c = id && STATE.all.find(x => x.id === id);
      const slot = el("div", { class: "slot" + (c ? "" : " empty") });
      slot.appendChild(el("div", { class: "slot-no", text: String(i + 1) }));
      slot.appendChild(el("div", { class: "slot-name", text: c ? c.nameKo : "빈 칸" }));

          [front ? "▼" : "▲", front ? "후방으로" : "전방으로", () => {     // 반대편 첫 빈 칸, 없으면 그 줄 첫 칸과 맞바꿈
            const [a, b] = front ? [FRONT_N, PARTY_MAX] : [0, FRONT_N];
            for (let x = a; x < b; x++) if (!STATE.party[x]) return x;
            return a;

        for (const [t, tip, to] of btns) {

          const b = el("button", { class: "slot-btn", text: t, attrs: { title: tip } });

}

const defaultAttack = atks => AEOpt.attackPool(atks, !!STATE.calc.cond)[0] || atks[0];
const atkLabel = a => `${a.skill} · ${a.mult}${a.multMax ? "~" + a.multMax : ""}%${a.element ? " " + a.element : ""} ${a.atk}${a.sec !== "skills" ? " [성도/SB]" : ""}`;

// 계산 멤버 — 저장된 장비 · 공격 · 캐릭터창 스탯(장비 제외 값)을 입힌다. fx 는 data/calc/fx.json(계산에 닿는 효과만)
function calcMember(db, c, pos = "front") {
  const cc = db.chars[c.id];
  if (!cc) return null;
  const conf = STATE.calc.m[c.id] || {};
  const atks = cc.attacks.filter(a => a.mult || a.multMax);
  const attack = atks.find(a => a.skill === conf.attack) || defaultAttack(atks);
  const weapon = byName(db.weapons.filter(w => w.type === cc.weapon), conf.weapon) || AEParty.bestWeapon(db.weapons, cc.weapon, attack && attack.dep === "magic");
  const fx = (db.fx[c.id] || []).filter(u => { const p = posReq(u); return !p || p === pos; });
  return { c, cc, pos, fx, atks, attack, weapon, armor: byName(db.armor, conf.armor),
    grasta: (conf.grasta || []).map(n => findGrasta(db, n, c.traits)).filter(Boolean),
    badges: (conf.badges || []).map(n => byName(db.badges, n)).filter(Boolean),
    stats: conf.base ? { ...cc.stats, ...conf.base } : cc.stats, zones: cc.zones || [] };
}
function calcOpt(db) {
  const S = STATE.calc;
  return { enemy: db.enemies.find(e => enemyLabel(e) === S.enemy) || BASE_ENEMY, zone: db.zones.find(z => z.name === S.zone) || null,
    cond: !!S.cond, maxHp: !!S.maxHp, punish: S.pain ? ["pain", "poison"] : [] };
}
const gearStats = (m, opt) => AEParty.equipFor([m.weapon, m.armor, ...m.grasta, ...m.badges], m.attack || {}, opt || {}).stats;
function saveGear(id, gear, attack) {
  const conf = STATE.calc.m[id] = STATE.calc.m[id] || {};
  conf.weapon = gear.weapon ? gear.weapon.name : ""; conf.armor = gear.armor ? gear.armor.name : "";
  conf.grasta = gear.grasta.map(g => g.name); conf.badges = gear.badges.map(b => b.name);
  if (attack) conf.attack = attack.skill;
  saveCalc();
}
// 장비 후보 — 「보유 장비만」이면 보유 목록(STATE.inv) 안에서, 보유 수까지
function gearPools(db, m) {
  if (!STATE.calc.ownedOnly) return { pools: AEOpt.damagePools(db, m.cc, m.c.traits), counts: null };
  const inv = STATE.inv;
  const sub = { weapons: db.weapons.filter(x => inv.w[x.name]), armor: db.armor.filter(x => inv.a[x.name]),
    grasta: db.grasta.filter(x => inv.g[x.name]), badges: db.badges.filter(x => inv.b[x.name]) };
  return { pools: AEOpt.damagePools(sub, m.cc, m.c.traits), counts: { ...inv.w, ...inv.a, ...inv.g, ...inv.b } };
}
function runGear(db, m, team, opt, attacks) {
  const { pools, counts } = gearPools(db, m);
  return AEOpt.bestSetup(m, team, opt, pools, { grastaSlots: STATE.calc.gslots || 4, badgeSlots: 2, counts }, attacks);
}

// 전투 조건 줄 — 적 · 존 · 토글 (+ 장비: 그라스타 칸 · 보유 장비만)
function buildCondBar(db, rerender, o = {}) {
  const S = STATE.calc;
  const bar = el("div", { class: "filter-group", style: "gap:10px;align-items:center;margin:8px 0" });
  const dlId = S.bossOnly ? "calc-bosses" : "calc-enemies";
  if (!document.getElementById(dlId)) {
    const dl = el("datalist", { attrs: { id: dlId } });
    for (const e of db.enemies) if (!S.bossOnly || /Boss|Horror|Bounty/.test(e.type || "")) dl.appendChild(el("option", { attrs: { value: enemyLabel(e) } }));
    document.body.appendChild(dl);
  }
  const enemy = calcOpt(db).enemy;
  const ein = el("input", { class: "fx-input", attrs: { list: dlId, placeholder: "적 (비우면 기준 적)", value: enemy === BASE_ENEMY ? "" : S.enemy } });
  ein.addEventListener('change', () => { S.enemy = ein.value.trim(); saveCalc(); rerender(); });
  const tog = (key, label, tip) => {
    const lab = el("label", { class: "pt", attrs: { title: tip } });

    cb.addEventListener('change', () => { S[key] = cb.checked; saveCalc(); rerender(); });
    lab.append(cb, document.createTextNode(" " + label));

  };
  bar.append(ein, tog("bossOnly", "보스 · 호러만", "적 목록을 Boss · Horror 로 좁힌다"));
  if (o.zone !== false) {
    const zsel = el("select", { class: "fx-input" });
    zsel.appendChild(el("option", { text: "존 없음", attrs: { value: "" } }));
    for (const z of db.zones) zsel.appendChild(el("option", { text: `${z.name} (${z.up.types.join("·")} +${z.up.v ?? "?"}%)`, attrs: { value: z.name } }));
    zsel.value = S.zone || "";
    zsel.addEventListener('change', () => { S.zone = zsel.value; saveCalc(); rerender(); });
    bar.append(zsel);
  }
  bar.append(tog("cond", "조건부 효과 포함", "「Another Zone 중」「3명 이상일 때」 같은 조건을 다 만족했다고 본다 + 범위 배율(150~18000%)은 위값 + MP 0 특수기(일반 공격 대체 · 스택 발동)도 후보"),
    tog("maxHp", "HP 최대", "장비 「HP 최대 시 대미지+」 적용"), tog("pain", "적 페인 · 독", "페인/독 그라스타 ×1.3 적용"));
  if (o.gear) {
    const gsel = el("select", { class: "fx-input", attrs: { title: "4번 칸은 그 캐릭터의 천명 합계 200 이상에서 열린다" } });
    for (const n of [3, 4]) gsel.appendChild(el("option", { text: `그라스타 ${n}칸`, attrs: { value: String(n) } }));
    gsel.value = String(S.gslots || 4);
    gsel.addEventListener('change', () => { S.gslots = +gsel.value; saveCalc(); rerender(); });
    bar.append(gsel, tog("ownedOnly", "보유 장비만", "자동 · 추천을 「보유 목록」에 넣은 장비 안에서만(보유 수까지)"));
  }
  return bar;
}
function enemyLine(enemy) {
  const aff = (k, t) => { const v = (enemy[k] || []).filter(x => x !== "-"); return v.length ? ` · ${t} ${v.join("·")}` : ""; };
  return el("div", { class: "skko-src", text: `적: ${enemy.name} — 내구 ${enemy.end ?? "?"} · 정신 ${enemy.spr ?? "?"}` +
    aff("weak", "약점") + aff("resist", "경감") + aff("null", "무효") + aff("absorb", "흡수") + (enemy.varies ? " · 상성 변동" : "") });
}

// 장비 입력 — 목록이 길어(무기 150 · 그라스타 500) select 대신 datalist 입력칸
function ensureDatalist(id, items, label) {
  if (!document.getElementById(id)) {
    const dl = el("datalist", { attrs: { id } });
    for (const it of items) dl.appendChild(el("option", { attrs: { value: it.name, label: label ? label(it) : "" } }));
    document.body.appendChild(dl);
  }
  return id;
}
const fxSummary = it => [it.effect, ...(it.fx || []).filter(f => f.k !== "etc").map(f => `${f.k}${f.when ? ":" + f.when : ""}${f.stat ? ":" + f.stat : ""} ${f.v}`)]
  .filter(Boolean).join(" · ").slice(0, 70);
function gearLists(db, m) {
  const wl = db.weapons.filter(w => w.type === m.cc.weapon).sort((a, b) => b.atk + b.matk - a.atk - a.matk);
  const gl = db.grasta.filter(g => g.type !== "VC" && AEOpt.canGrasta(g, m.c.traits));
  return {
    w: [wl, ensureDatalist("dl-w-" + m.cc.weapon, wl, w => `공 ${w.atk} · 마공 ${w.matk}` + (w.fx.some(f => f.k !== "etc") ? " · " + fxSummary(w) : ""))],
    a: [db.armor, ensureDatalist("dl-a", db.armor, fxSummary)],
    g: [gl, ensureDatalist("dl-g-" + m.c.id, gl, g => `${Object.entries(g.stats).map(([k, v]) => k.toUpperCase() + v).join(" ")} · ${g.effect}`.slice(0, 80))],
    b: [db.badges, ensureDatalist("dl-b", db.badges, b => b.effect.slice(0, 70))],
  };
}
function gearInput(list, dlId, cur, onPick, ph = "없음") {
  const inp = el("input", { class: "fx-input gear-in", attrs: { list: dlId, placeholder: ph, value: cur || "" } });
  inp.addEventListener('change', () => {
    const v = inp.value.trim();
    if (v && !list.some(x => x.name === v)) { inp.value = cur || ""; return; }
    onPick(v);
  });
  return inp;
}
// 한 멤버의 장비 칸 — 무기 · 방어구 · 그라스타 N · 배지 2
function gearEditor(db, m, rerender) {
  const conf = STATE.calc.m[m.c.id] = STATE.calc.m[m.c.id] || {};
  const L = gearLists(db, m), box = el("div", { class: "gear-ed" });
  const row = (k, inp) => box.appendChild(el("div", { class: "gear-row", children: [el("span", { class: "gear-k", text: k }), inp] }));
  const set = (k, v) => { conf[k] = v; saveCalc(); rerender(); };
  const setAt = (k, i, v) => { const a = [...(conf[k] || [])]; a[i] = v; set(k, a.filter(Boolean)); };
  row("무기", gearInput(L.w[0], L.w[1], conf.weapon ? m.weapon && m.weapon.name : "", v => set("weapon", v), `기본: ${m.weapon ? m.weapon.name : "없음"}`));
  row("방어구", gearInput(L.a[0], L.a[1], m.armor && m.armor.name, v => set("armor", v)));
  for (let i = 0; i < (STATE.calc.gslots || 4); i++) row(`그라스타${i + 1}`, gearInput(L.g[0], L.g[1], (m.grasta[i] || {}).name, v => setAt("grasta", i, v)));
  for (let i = 0; i < 2; i++) row(`배지${i + 1}`, gearInput(L.b[0], L.b[1], (m.badges[i] || {}).name, v => setAt("badges", i, v)));
  return box;
}

async function renderCalc(wrap, members) {
  const sec = el("div", { class: "section", children: [el("h3", { text: "7. 대미지 추정 (정적 · 스킬 1회)" })] });

    "아군 효과는 「아군 전체 · 자신」 대상만, 조건부 효과는 토글로. 「⚙ 자동」 = 이 파티 안에서 그 스킬 대미지가 가장 큰 장비로 채움. 목표 오차 ±5% — 인게임 대조 전이라 아직 추정치입니다." }));
  let db;
  try { db = await loadCalcDb(); } catch (e) { sec.appendChild(el("div", { class: "empty-state", text: "계산 데이터 로드 실패: " + e.message })); return; }
  sec.appendChild(buildCondBar(db, renderParty, { gear: true }));
  const opt = calcOpt(db);
  sec.appendChild(enemyLine(opt.enemy));
  const team = members.map(m => calcMember(db, m.c, m.pos) || { ...m, attack: null });
  const tbl = el("table", { class: "skill-table party-table" });
  tbl.appendChild(el("thead", { children: [el("tr", { children: ["멤버", "스킬", "장비", "일반", "크리 (확률)", "기대값", "근거"].map(h => el("th", { text: h })) })] }));
  const tb = el("tbody");
  let sum = 0;
  for (const m of team.filter(x => x.pos === "front")) {
    const tr = el("tr");
    tr.appendChild(el("td", { text: m.c.nameKo }));
    if (!m.cc || !m.attack) { tr.appendChild(el("td", { text: "계산 데이터 없음", attrs: { colspan: 6 } })); tb.appendChild(tr); continue; }
    const conf = STATE.calc.m[m.c.id] = STATE.calc.m[m.c.id] || {};
    const s = el("select", { class: "fx-input", style: "max-width:220px" });
    for (const a of m.atks) s.appendChild(el("option", { text: atkLabel(a), attrs: { value: a.skill } }));
    s.value = m.attack.skill;
    s.addEventListener('change', () => { conf.attack = s.value; saveCalc(); renderParty(); });
    const auto = el("button", { class: "slot-btn", text: "⚙ 자동", attrs: { title: "이 스킬 기준 최적 장비(「보유 장비만」이면 보유 목록 안에서)" } });
    auto.addEventListener('click', () => { const r = runGear(db, m, team, opt, [m.attack]); saveGear(m.c.id, r.gear); renderParty(); });
    tr.appendChild(el("td", { children: [s, el("div", { style: "margin-top:6px", children: [auto] })] }));
    tr.appendChild(el("td", { children: [gearEditor(db, m, renderParty)] }));
    const d = AEParty.memberDamage(m, team, opt);
    if (!d) { tr.appendChild(el("td", { text: "배율 없음", attrs: { colspan: 4 } })); tb.appendChild(tr); continue; }
    sum += d.expected;
    tr.appendChild(el("td", { text: fmtN(d.normal) }));
    tr.appendChild(el("td", { text: `${fmtN(d.crit)} (${Math.round(d.p * 100)}%)` }));
    tr.appendChild(el("td", { class: "role-ok", text: fmtN(d.expected) }));
    tr.appendChild(el("td", { children: [whyDetails(d)] }));
    tb.appendChild(tr);
  }
  tbl.appendChild(tb);
  sec.appendChild(el("div", { class: "table-scroll", children: [tbl] }));
  sec.appendChild(el("div", { class: "pt", children: [el("b", { text: `전방 1회씩 합계 기대값: ${fmtN(sum)}` })] }));
  sec.appendChild(el("div", { class: "skko-src", text: CALC_ASSUME }));
}
const CALC_ASSUME = "가정 — 스탯: 최대 레벨 + 성도 각성 + 명암 255(캐릭터창 값을 넣으면 그것) · 무작위 배지는 주 스탯 최대치 · 부 스탯 제외 · 무기: 위키 최대 강화 · 스킬 배율: 위키 최대 레벨(범위면 기본값, 「조건부 효과 포함」이면 위값) · 크리: 행운/16% + 크리율 가산 · " +
  "중첩: 위키 Damage Formula/Multipliers(체감 · 반감 · 가산 · 곱). 「특정 아군」 대상 효과 · 고유 축적 · 정신 통일 비율(0.23%/MP 고정) · 연성 광석 · 증표(VC) 그라스타는 단순화 · 미반영.";
function whyDetails(d) {

  why.appendChild(document.createTextNode([`스탯 힘 ${o.stat.pwr} · 지능 ${o.stat.int} · 속도 ${o.stat.spd} · 행운 ${o.stat.lck} · MP ${o.stat.mp}`,
    `배율 ${Math.round(o.skillMult * 100)}% · 그룹 ${o.groups.map(pctS).join(" / ")} · 장비 가산 ${o.equip.map(pctS).join(" + ") || "없음"} · 페인/독 ×1.3^${o.punish} · 단일 ${o.single ? "×1.1" : "-"}`,
