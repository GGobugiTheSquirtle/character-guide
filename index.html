  ctx.addEventListener('change', () => { O.ctx = ctx.value; saveOv(); rr(); });
  top.appendChild(ctx);
  box.appendChild(buildCondBar(db, rr, { gear: true }));
  const opt = calcOpt(db);
  box.appendChild(enemyLine(opt.enemy));

  const conf = STATE.calc.m[c.id] = STATE.calc.m[c.id] || {};
  const team = ctx.value === "party"
    ? STATE.party.map((id, i) => { const x = id && STATE.all.find(y => y.id === id); return x ? calcMember(db, x, i < FRONT_N ? "front" : "back") : null; }).filter(Boolean)
    : [];
  const m = team.find(x => x.c.id === c.id) || calcMember(db, c);
  if (!team.length) team.push(m);
  // 공격 — 자동이면 모든 스킬에 장비를 맞춰 보고 가장 큰 것
  const asel = el("select", { class: "fx-input", style: "max-width:300px" });
  asel.appendChild(el("option", { text: "공격: 자동 (가장 센 스킬)", attrs: { value: "" } }));
  for (const a of m.atks) asel.appendChild(el("option", { text: atkLabel(a), attrs: { value: a.skill } }));
  asel.value = O.atk && O.atk[c.id] || "";
  asel.addEventListener('change', () => { O.atk = { ...(O.atk || {}), [c.id]: asel.value }; saveOv(); rr(); });
  box.appendChild(el("div", { class: "filter-group", style: "margin:6px 0 12px", children: [asel,
    el("span", { class: "pt more", text: `${m.cc.weapon} · ${c.elementKo || ""} · 특성 ${(c.traits || []).join(" · ") || "—"}${m.zones.length ? " · 존 " + m.zones.join(", ") : ""}` })] }));
  const fixedAtk = m.atks.find(a => a.skill === asel.value);
  const attacks = fixedAtk ? [fixedAtk] : AEOpt.attackPool(m.atks, opt.cond);
  const cur = { ...m, attack: fixedAtk || m.attack };
  const curTeam = team.map(x => (x.c.id === c.id ? cur : x));
  const dCur = AEParty.memberDamage(cur, curTeam, opt);
  const res = runGear(db, m, team, opt, attacks);
  const rec = { ...m, attack: res.attack, ...res.gear };
  const recTeam = team.map(x => (x.c.id === c.id ? rec : x));
  const dRec = AEParty.memberDamage(rec, recTeam, opt);

  // 캐릭터창 — 스탯(장비 제외 · 현재 장비 · 화면 값 입력 · 추천 시) + 장비 칸(현재 · 추천)
  const cw = el("div", { class: "cw" });
  const gCur = gearStats(cur, opt), gRec = gearStats(rec, opt);
  const st = el("table", { class: "skill-table" });
  st.appendChild(el("thead", { children: [el("tr", { children: ["스탯", "장비 제외", "+ 현재 장비", "캐릭터창 값", "추천 장비 시"].map(h => el("th", { text: h })) })] }));
  const stb = el("tbody");
  for (const [k, label] of STAT_KEYS) {
    const base = m.stats[k] || 0, shown = Math.round(base + (gCur[k] || 0)), after = Math.round(base + (gRec[k] || 0));
    const inp = el("input", { class: "cw-num", attrs: { type: "number", value: String(shown), title: "게임 캐릭터창에 보이는 값(장비 포함)을 넣으면 장비 몫을 빼서 저장" } });
    inp.addEventListener('change', () => {
      const v = Number(inp.value);
      if (!isFinite(v)) return;
      conf.base = { ...(conf.base || {}), [k]: v - (gCur[k] || 0) };
      saveCalc(); rr();
    });
    stb.appendChild(el("tr", { children: [el("td", { text: label }), el("td", { text: String(Math.round(base)), class: conf.base && conf.base[k] != null ? "role-ok" : "" }),
      el("td", { text: gCur[k] ? `+${Math.round(gCur[k])}` : "" }), el("td", { children: [inp] }),
      el("td", { text: String(after), class: after > shown ? "up" : after < shown ? "down" : "" })] }));
  }
  st.appendChild(stb);
  const stBox = el("div", { class: "cw-box", children: [el("h4", { text: "스탯" }), st] });
  const reset = el("button", { class: "slot-btn", text: "위키 최대치로 되돌리기", attrs: { title: "최대 레벨 + 성도 각성 + 명암 255" } });
  reset.addEventListener('click', () => { delete conf.base; saveCalc(); rr(); });
  stBox.appendChild(el("div", { class: "skko-src", style: "margin-top:8px", children: [document.createTextNode(conf.base ? "캐릭터창 값으로 계산 중(금색 = 직접 넣은 값). " : "위키 최대치(최대 레벨 + 성도 각성 + 명암 255) 가정. 내 캐릭터창 값을 넣으면 그 값으로 계산합니다. "), conf.base ? reset : null].filter(Boolean) }));
  const gt = el("table", { class: "skill-table" });
  gt.appendChild(el("thead", { children: [el("tr", { children: ["칸", "현재 (입력)", "추천"].map(h => el("th", { text: h })) })] }));
  const gtb = el("tbody"), ed = gearEditor(db, cur, rr);
  const recNames = [rec.weapon, rec.armor, ...Array.from({ length: STATE.calc.gslots || 4 }, (_, i) => rec.grasta[i]), rec.badges[0], rec.badges[1]];
  [...ed.children].forEach((row, i) => {
    const [k, inp] = row.children, r = recNames[i], same = (r ? r.name : "") === (inp.value || (i === 0 ? (cur.weapon || {}).name : "") || "");
    gtb.appendChild(el("tr", { children: [el("td", { text: k.textContent }), el("td", { children: [inp] }),
      el("td", { class: same ? "pt more" : "pt role-ok", text: r ? r.name : "— (대미지 무관)", attrs: { title: r ? fxSummary(r) : "" } })] }));
  });
  gt.appendChild(gtb);
  cw.append(stBox, el("div", { class: "cw-box", children: [el("h4", { text: "장비" }), el("div", { class: "table-scroll", children: [gt] })] }));
  box.appendChild(cw);

  // 결과
  const gain = dCur && dCur.expected > 0 ? dRec.expected / dCur.expected - 1 : null;
  const apply = el("button", { class: "view-btn active", text: "추천 장비 적용" });
  apply.addEventListener('click', () => { saveGear(c.id, res.gear, res.attack); rr(); });
  const sum = el("div", { class: "cw-box", style: "margin-top:12px" });
  sum.append(el("h4", { text: "기대값 (스킬 1회)" }),
    el("div", { class: "pt", text: `현재 — ${cur.attack.skill}: ${dCur ? fmtN(dCur.expected) : "—"}` }),
    el("div", { class: "pt", children: [el("b", { class: "role-ok", text: `추천 — ${res.attack.skill}: ${fmtN(dRec.expected)}` }),
      document.createTextNode(gain == null ? "" : `  (${gain >= 0 ? "+" : ""}${(gain * 100).toFixed(1)}%)`)] }),
    el("div", { class: "skko-src", style: "margin:6px 0", text: `후보: ${STATE.calc.ownedOnly ? "보유 목록" : "전체 장비"} · 평가 ${res.evals.toLocaleString()}회 · 공격 ${attacks.length}개 비교 · 그라스타 ${STATE.calc.gslots || 4}칸 · 배지 2칸` }),
    apply, el("div", { style: "margin-top:8px", children: [whyDetails(dRec)] }));
  if (STATE.calc.ownedOnly && !gearPools(db, m).pools.weapons.length) sum.appendChild(el("div", { class: "pt role-gap", text: `보유 목록에 ${m.cc.weapon} 무기가 없습니다.` }));
  box.appendChild(sum);
  box.appendChild(el("div", { class: "skko-src", style: "margin-top:10px", text: "장비 최적화 = 한 칸씩 모든 후보로 바꿔 보며 더 오르지 않을 때까지 반복(축소 공간 전수 탐색과 24/24 일치). " + CALC_ASSUME }));
}

// ── 파티 추천 ─────────────────────────────────────
async function renderPartyTab(box, db) {
  const O = STATE.ov, S = STATE.calc, rr = renderOpt;
  box.appendChild(buildCondBar(db, rr, { zone: O.zoneMode === "fixed" }));
  const opt = calcOpt(db);
  box.appendChild(enemyLine(opt.enemy));
  const bar = el("div", { class: "filter-group", style: "gap:10px;align-items:center;margin:8px 0" });
  const sel = (key, opts, def) => {
    const s = el("select", { class: "fx-input" });
    for (const [v, t] of opts) s.appendChild(el("option", { text: t, attrs: { value: v } }));
    s.value = O[key] || def;
    s.addEventListener('change', () => { O[key] = s.value; saveOv(); rr(); });
    return s;
  };
  const owned = STATE.inv.chars.filter(id => db.chars[id]);
  bar.append(
    sel("roster", [["owned", `보유 캐릭터 (${owned.length}명)`], ["all", `전체 캐릭터 (${Object.keys(db.chars).length}명)`]], owned.length ? "owned" : "all"),
    sel("objective", [["sum", "목표: 전방 4명 합계"], ["carry", "목표: 주력 1명 최대"]], "sum"),
    sel("zoneMode", [["auto", "존: 파티원이 전개하는 것 중 최고"], ["none", "존: 없음"], ["fixed", "존: 직접 고르기"]], "auto"));
  box.appendChild(bar);
  // 고정 멤버
  const fixed = (O.fixed || []).filter(id => db.chars[id]);
  const fx = el("div", { class: "filter-group", style: "gap:6px;align-items:center;margin:4px 0 10px" });
  fx.appendChild(el("span", { class: "filter-label", text: "꼭 넣을 멤버" }));
  for (const id of fixed) {
    const c = STATE.all.find(x => x.id === id);
    const chip = el("span", { class: "chip active fx-sel", text: c ? c.nameKo : id });
    chip.addEventListener('click', () => { O.fixed = fixed.filter(x => x !== id); saveOv(); rr(); });
    fx.appendChild(chip);
  }
  if (fixed.length < 3) fx.appendChild(charPicker(db, null, x => { O.fixed = [...new Set([...fixed, x.id])]; saveOv(); rr(); }, "추가 (선택)"));
  box.appendChild(fx);
  const ros = (O.roster || (owned.length ? "owned" : "all")) === "owned" ? owned : Object.keys(db.chars);
  if (!ros.length) { box.appendChild(el("div", { class: "empty-state", text: "보유 목록이 비었습니다 — 「보유 목록」 탭에서 캐릭터를 넣거나 「전체 캐릭터」로 바꾸세요." })); return; }
  const run = el("button", { class: "view-btn active", text: "추천 파티 찾기" });
  const prog = el("span", { class: "pt more", style: "margin-left:10px" });
  box.append(el("div", { children: [run, prog] }));
  const out = el("div", { style: "margin-top:12px" });
  box.appendChild(out);
  const key = JSON.stringify([ros.length, ros.slice(0, 3), O.objective, O.zoneMode, S.zone, S.enemy, S.cond, S.maxHp, S.pain, fixed]);
  if (STATE.ovRes && STATE.ovRes.key === key) showPartyResult(out, db, STATE.ovRes);
  run.addEventListener('click', async () => {
    run.disabled = true; clear(out);
    const t0 = performance.now();
    const cands = [...new Set([...ros, ...fixed])].map(id => STATE.all.find(x => x.id === id)).filter(Boolean).map(c => {
      const m = calcMember(db, c);
      m.atks = AEOpt.attackPool(m.atks, opt.cond).slice(0, 4);
      return m;
    }).filter(m => m.atks.length);
    const r = await AEOpt.partySearch(cands, opt, { size: FRONT_N, objective: O.objective || "sum", zoneMode: O.zoneMode || "auto", zoneDb: db.zones, fixed,
      tick: async n => { prog.textContent = `평가 ${n.toLocaleString()}팀…`; await new Promise(res => setTimeout(res)); } });
    prog.textContent = `${cands.length}명(가지치기 후 ${r.pool}) · ${r.evals.toLocaleString()}팀 평가 · ${((performance.now() - t0) / 1000).toFixed(1)}초`;
    STATE.ovRes = { key, ...r, opt };
    showPartyResult(out, db, STATE.ovRes);
    run.disabled = false;
  });
  box.appendChild(el("div", { class: "skko-src", style: "margin-top:12px", text: "탐색 = 단독 딜 상위 8명에서 각각 출발 → 한 명씩 가장 좋은 멤버로 채움 → 한 자리씩 바꿔 오르지 않을 때까지(무작위 12명 명단 20개 — 4명 전수 탐색 1위와 20/20 일치). " +
    "전방 4명만 평가 · 장비는 저장된 것(없으면 무기 최고 공격력, 그라스타 · 배지 없음) — 고른 뒤 파티 구성 7절 「⚙ 자동」으로 장비를 맞추세요. 같은 캐릭터의 다른 스타일은 한 파티에 하나만." }));
}
function showPartyResult(out, db, r) {
  const tbl = el("table", { class: "skill-table party-table" });
  tbl.appendChild(el("thead", { children: [el("tr", { children: ["#", "파티 (스킬 · 1회 기대값)", "존", "점수", ""].map(h => el("th", { text: h })) })] }));
  const tb = el("tbody");
  r.list.forEach((p, i) => {
    const who = el("td");
    for (const x of p.per) {
      const c = STATE.all.find(y => y.id === x.id);
      who.appendChild(el("div", { class: "pt", children: [el("b", { text: c ? c.nameKo : x.id }),
        document.createTextNode(` — ${x.attack ? x.attack.skill : "공격 없음"} · ${fmtN(x.expected)}`)] }));
    }
    const go = el("button", { class: "slot-btn", text: "파티 구성으로" });
    go.addEventListener('click', () => {
      STATE.party = [...p.ids];
      for (const x of p.per) if (x.attack) { const cf = STATE.calc.m[x.id] = STATE.calc.m[x.id] || {}; cf.attack = x.attack.skill; }
      if (p.zone) STATE.calc.zone = p.zone.name; else STATE.calc.zone = "";
      saveParty(); saveCalc(); setView("party");
    });
    tb.appendChild(el("tr", { children: [el("td", { text: String(i + 1) }), who, el("td", { class: "pt", text: p.zone ? p.zone.name : "없음" }),
      el("td", { class: "role-ok", text: fmtN(p.score) }), el("td", { children: [go] })] }));
  });
  tbl.appendChild(tb);
  out.appendChild(el("div", { class: "table-scroll", children: [tbl] }));
}

// ── 보유 목록 ─────────────────────────────────────
function renderInvTab(box, db) {
  const inv = STATE.inv, rr = renderOpt;
  const cands = STATE.all.filter(c => db.chars[c.id]);
  box.appendChild(el("div", { class: "skko-src", text: "이 브라우저에만 저장됩니다. 파티 추천은 「보유 캐릭터」, 장비 추천은 「보유 장비만」을 켜면 이 목록 안에서 고릅니다." }));
  // 캐릭터 — 붙여넣기(줄 · 쉼표 구분, 한국어 · 영어 · 일본어 이름) + 하나씩
  const s1 = el("div", { class: "section", children: [el("h3", { text: `캐릭터 ${inv.chars.length}명` })] });
  const ta = el("textarea", { class: "inv-ta", attrs: { rows: "3", placeholder: "이름을 줄바꿈이나 쉼표로 붙여넣기 — 예: 알도, 페이네, 멜피피아 AS" } });
  const addBtn = el("button", { class: "slot-btn", text: "붙여넣은 이름 추가" });
  addBtn.addEventListener('click', () => {
    const names = ta.value.split(/[\n,，、]+/).map(s => s.trim()).filter(Boolean), miss = [];
    for (const n of names) {
      const c = cands.find(x => [x.nameKo, x.nameEn, x.name_jp].some(v => v && v.toLowerCase() === n.toLowerCase()));
      if (c) { if (!inv.chars.includes(c.id)) inv.chars.push(c.id); } else miss.push(n);
    }
    saveInv(); rr();
    if (miss.length) setTimeout(() => alert("못 찾은 이름: " + miss.join(", ")));
  });
  const all = el("button", { class: "slot-btn", text: "전원 보유로" });
  all.addEventListener('click', () => { inv.chars = cands.map(c => c.id); saveInv(); rr(); });
  const none = el("button", { class: "slot-btn", text: "비우기" });
  none.addEventListener('click', () => { if (confirm("보유 캐릭터를 모두 지울까요?")) { inv.chars = []; saveInv(); rr(); } });
  s1.append(ta, el("div", { class: "filter-group", style: "gap:6px;margin:6px 0", children: [addBtn,
    charPicker(db, null, x => { if (!inv.chars.includes(x.id)) inv.chars.push(x.id); saveInv(); rr(); }, "한 명씩 추가"), all, none] }));
  const chips = el("div", { class: "inv-chips" });
  for (const id of inv.chars) {
    const c = STATE.all.find(x => x.id === id);
    const chip = el("span", { class: "chip fx-sel", text: c ? c.nameKo : id, attrs: { title: "빼기" } });
    chip.addEventListener('click', () => { inv.chars = inv.chars.filter(x => x !== id); saveInv(); rr(); });
    chips.appendChild(chip);
  }
  s1.appendChild(chips);
  box.appendChild(s1);
  // 장비 — 종류별 이름 + 개수
  const s2 = el("div", { class: "section", children: [el("h3", { text: "장비" })] });
  for (const [k, list, label, dl] of [["w", db.weapons, "무기", ensureDatalist("dl-wall", db.weapons, w => `${w.type} · 공 ${w.atk} · 마공 ${w.matk}`)],
    ["a", db.armor, "방어구", ensureDatalist("dl-a", db.armor, fxSummary)],
    ["g", db.grasta.filter(g => g.type !== "VC"), "그라스타", ensureDatalist("dl-gall", db.grasta.filter(g => g.type !== "VC"), g => `${g.req.length ? g.req.join("/") + " 전용 · " : ""}${g.effect}`.slice(0, 80))],
    ["b", db.badges, "배지", ensureDatalist("dl-b", db.badges, b => b.effect.slice(0, 70))]]) {
    const row = el("div", { class: "filter-group", style: "gap:6px;align-items:center;margin:8px 0" });
    row.appendChild(el("span", { class: "filter-label", style: "width:64px", text: `${label} ${Object.keys(inv[k]).length}` }));
    row.appendChild(gearInput(list, dl, "", v => { if (v) { inv[k][v] = (inv[k][v] || 0) + 1; saveInv(); rr(); } }, `${label} 추가 (이름)`));
    for (const [n, cnt] of Object.entries(inv[k])) {
      const chip = el("span", { class: "chip", text: cnt > 1 ? `${n} ×${cnt}` : n, attrs: { title: "클릭 = 1개 빼기" } });
      chip.addEventListener('click', () => { if (--inv[k][n] <= 0) delete inv[k][n]; saveInv(); rr(); });
      row.appendChild(chip);
    }
    s2.appendChild(row);
  }
  s2.appendChild(el("div", { class: "skko-src", text: "같은 이름을 다시 넣으면 개수가 늘어납니다(통증의 힘 ×3 같은 중복 장착용). 그라스타 이름의 괄호는 스탯 변형 — 무기 · 특성 전용은 낄 수 있는 캐릭터만 씁니다." }));
  box.appendChild(s2);
  // 백업
  const s3 = el("div", { class: "section", children: [el("h3", { text: "백업" })] });
  const io = el("textarea", { class: "inv-ta", attrs: { rows: "3", placeholder: "「내보내기」를 누르면 여기에 JSON — 다른 기기에서 붙여넣고 「가져오기」" } });
  const ex = el("button", { class: "slot-btn", text: "내보내기" });
  ex.addEventListener('click', () => { io.value = JSON.stringify({ inv: STATE.inv, calc: STATE.calc.m }); io.select(); });
  const im = el("button", { class: "slot-btn", text: "가져오기" });
  im.addEventListener('click', () => {
    try {
      const d = JSON.parse(io.value);
      if (!d.inv || !Array.isArray(d.inv.chars)) throw new Error("inv 없음");
      STATE.inv = { chars: [], w: {}, a: {}, g: {}, b: {}, ...d.inv };
      if (d.calc) STATE.calc.m = d.calc;
      saveInv(); saveCalc(); rr();
    } catch (e) { alert("가져오기 실패: " + e.message); }
  });
  s3.append(io, el("div", { class: "filter-group", style: "gap:6px;margin-top:6px", children: [ex, im] }));
  box.appendChild(s3);
}

function buildSkillTable(rows) {
  const sec = el("div", { class: "section", children: [el("h3", { text: `스킬 (${rows.length - 1}행)` })] });
  const tbl = el("table", { class: "skill-table" });
  const thead = el("thead");
  const trHead = el("tr");
  const header = rows[0];
  // 헤더 한국어 변환
  for (const h of header) trHead.appendChild(el("th", { text: SKILL_HEADER_KO[h] || h }));
  thead.appendChild(trHead);
  tbl.appendChild(thead);
  // 속성/MP 컬럼 인덱스 (속성 셀 한국어 변환용)
  const idxElem = header.indexOf("属性");
  const tbody = el("tbody");
  for (const row of rows.slice(1)) {
    const tr = el("tr");
    for (let i = 0; i < row.length; i++) {
      let val = row[i];
      if (i === idxElem && ELEM_CELL_KO[val]) val = ELEM_CELL_KO[val];
      tr.appendChild(el("td", { text: val }));
    }
    tbody.appendChild(tr);
  }
  tbl.appendChild(tbody);
  sec.appendChild(tbl);
  return sec;
}

function findPrefix(sections, prefix) {
  for (const k in sections) if (k.startsWith(prefix)) return sections[k];
  return "";
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
}

// 검색
document.getElementById('search').addEventListener('input', e => {
  STATE.search = e.target.value.trim();
  render();
});
// 모달 닫기 (배경/ESC)
document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});
window.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

init();
</script>
